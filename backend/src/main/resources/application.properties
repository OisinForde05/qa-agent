spring.application.name=qa-agent-backend

spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:qa_agent}
spring.datasource.username=${DATABASE_USERNAME:qa_agent_app}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:}

jira.base-url=${JIRA_BASE_URL:}
jira.email=${JIRA_EMAIL:}
jira.api-token=${JIRA_API_TOKEN:}